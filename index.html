<!doctype html>
<html class="landing" lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MR.MAJMA</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Every run starts from here. The referrer guard in jb.js arms the chain
         only when it was reached from this page, so that a browser restoring
         its last session cannot re-run it unattended. -->
    <div id="brand"><b>MR.MAJMA</b></div>

    <div class="shell">
      <svg class="meme" viewBox="0 0 260 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <radialGradient id="glow" cx="50%" cy="45%" r="60%">
            <stop offset="0%" stop-color="#7fd0a0" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#7fd0a0" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <circle cx="130" cy="95" r="95" fill="url(#glow)">
          <animate attributeName="r" values="92;98;92" dur="3.5s" repeatCount="indefinite"/>
        </circle>

        <g stroke="#2b3a4c" stroke-width="2" fill="none" opacity="0.8">
          <path d="M10 40 H70 M10 160 H70 M250 40 H190 M250 160 H190"/>
          <circle cx="70" cy="40" r="3" fill="#4d5765"/>
          <circle cx="70" cy="160" r="3" fill="#4d5765"/>
          <circle cx="190" cy="40" r="3" fill="#4d5765"/>
          <circle cx="190" cy="160" r="3" fill="#4d5765"/>
        </g>

        <g>
          <path d="M60 95
                   C60 55, 95 50, 130 55
                   C165 50, 200 55, 200 95
                   C200 125, 190 150, 170 150
                   C155 150, 150 130, 130 130
                   C110 130, 105 150, 90 150
                   C70 150, 60 125, 60 95 Z"
                fill="#11151b" stroke="#1e2732" stroke-width="2"/>

          <g fill="#7c8798">
            <rect x="82" y="85" width="22" height="8" rx="2"/>
            <rect x="89" y="78" width="8" height="22" rx="2"/>
          </g>

          <g fill="none" stroke="#7fd0a0" stroke-width="2">
            <circle cx="178" cy="78" r="6">
              <animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" begin="0s" repeatCount="indefinite"/>
            </circle>
            <circle cx="192" cy="92" r="6">
              <animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" begin="0.3s" repeatCount="indefinite"/>
            </circle>
            <circle cx="178" cy="106" r="6">
              <animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
            </circle>
            <circle cx="164" cy="92" r="6">
              <animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" begin="0.9s" repeatCount="indefinite"/>
            </circle>
          </g>

          <rect x="110" y="68" width="40" height="18" rx="4" fill="#0e1116" stroke="#2f4a3c"/>
          <circle cx="130" cy="77" r="3" fill="#7fd0a0">
            <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
          </circle>
        </g>
      </svg>

      <main class="panel">
        <p class="lede">PS4 firmware 12.00 &ndash; 14.02</p>

        <form class="pick" id="pick">
          <label class="opt">
            <input type="radio" name="payload" value="goldhen" checked />
            <span>GoldHEN</span>
          </label>

          <button class="btn" type="submit">start</button>
          <p class="count" id="count"></p>
          <p class="count" id="cache" aria-live="polite"></p>
        </form>
      </main>
    </div>

    <p class="byline">by mr.majma</p>
    <script src="launch.js"></script>
  </body>
</html>
